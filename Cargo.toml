[package]
name        = "hpm"
version     = "0.9.0"
edition     = "2021"
authors     = ["HackerOS Team <hackeros068@gmail.com>"]
description = "Hacker Package Manager – nowoczesny menedżer pakietów oparty na repozytoriach git"
license     = "GPL-3.0"

[[bin]]
name = "hpm"
path = "source-code/main.rs"

[dependencies]
serde        = { version = "1.0",  features = ["derive"] }
serde_json   = "1.0"
toml         = "0.8"
lexopt       = "0.3"
colored      = "2.1"
indicatif    = "0.17"
git2         = "0.18"
hk-parser    = "0.3.2"
indexmap     = { version = "2.2",  features = ["serde"] }
sha2         = "0.10"
hex          = "0.4"
walkdir      = "2"
landlock     = "0.3"
nix          = { version = "0.29", features = [
    "fs", "mount", "process", "sched", "user",
    "resource", "ioctl", "term", "hostname", "signal"
] }
# libseccomp 0.3 — prawdziwy unconditional deny bez hacka Op::Ge(0)
libseccomp   = "0.3"
libc         = "0.2"
scopeguard   = "1.2"
fs2          = "0.4"
tempfile     = "3.10"
rusqlite     = { version = "=0.31.0", features = ["bundled"] }
tokio        = { version = "1",    features = ["rt", "macros"] }
futures      = "0.3"
dirs         = "5.0"
miette       = { version = "5.10", features = ["fancy"] }
thiserror    = "1.0"
gpgme        = "0.11"
shellexpand  = "3.1"
reqwest      = { version = "0.11", default-features = false, features = [
    "json",
    "blocking",      # potrzebne dla verify --import-key
    "native-tls",
] }
